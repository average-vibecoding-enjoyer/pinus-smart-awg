name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            client/go.sum
            core/go.sum

      - name: Import optional code-signing certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            Write-Host "Code-signing certificate is not configured; release will be unsigned."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_SIGN_CERT_PASSWORD is missing."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "pinus-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $certificate = $imported | Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $certificate) {
              throw "The PFX does not contain a certificate with a private key."
            }
            "PINUS_SIGN_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify tag matches source version
        shell: pwsh
        run: |
          $source = Get-Content client/version/version.go -Raw
          if ($source -notmatch 'Number\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') {
            throw "Cannot read source version"
          }
          if ($env:GITHUB_REF_NAME -ne "v$($Matches[1])") {
            throw "Tag $env:GITHUB_REF_NAME does not match v$($Matches[1])"
          }

      - name: Build all release assets
        shell: pwsh
        run: ./build-public-release.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (Get-ChildItem release -File).FullName
          $notes = ".github/release-notes/$env:GITHUB_REF_NAME.md"
          if (Test-Path -LiteralPath $notes) {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --notes-file $notes --title "Pinus Smart AWG $env:GITHUB_REF_NAME"
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --title "Pinus Smart AWG $env:GITHUB_REF_NAME"
          }

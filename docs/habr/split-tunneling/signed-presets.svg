<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#0d2537"/>
    </linearGradient>
    <linearGradient id="cyan2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35bcff"/>
      <stop offset="1" stop-color="#577cff"/>
    </linearGradient>
    <linearGradient id="green2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39e0b4"/>
      <stop offset="1" stop-color="#16a486"/>
    </linearGradient>
    <pattern id="grid2" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#9fc8e8" stroke-opacity="0.05"/>
    </pattern>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#01050a" flood-opacity="0.46"/>
    </filter>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#43bfff"/>
    </marker>
    <style>
      .title2 { font: 700 46px "Segoe UI", Arial, sans-serif; fill: #f4f8ff; }
      .subtitle2 { font: 400 22px "Segoe UI", Arial, sans-serif; fill: #9dbad6; }
      .label2 { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #f4f8ff; }
      .body2 { font: 400 17px "Segoe UI", Arial, sans-serif; fill: #b6cadf; }
      .small2 { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #8eacc7; letter-spacing: 0.6px; }
      .bad2 { font: 600 17px "Segoe UI", Arial, sans-serif; fill: #ffad9e; }
    </style>
  </defs>

  <rect width="1600" height="720" fill="url(#bg2)"/>
  <rect width="1600" height="720" fill="url(#grid2)"/>

  <text x="82" y="84" class="title2">Обновление пресетов как цепочка доверия</text>
  <text x="82" y="122" class="subtitle2">Удалённый каталог влияет на сетевую политику, поэтому одного HTTPS здесь недостаточно</text>

  <g filter="url(#shadow2)">
    <rect x="82" y="208" width="238" height="186" rx="22" fill="#102b47" stroke="#2a648e" stroke-width="2"/>
    <rect x="104" y="232" width="92" height="26" rx="13" fill="url(#cyan2)"/>
    <text x="150" y="250" text-anchor="middle" style="font:700 13px 'Segoe UI';fill:#06121f">SOURCE</text>
    <text x="104" y="300" class="label2">catalog.signed.json</text>
    <text x="104" y="335" class="body2">GitHub · TLS 1.2+</text>
    <text x="104" y="364" class="body2">Лимит 512 КБ</text>
  </g>

  <path d="M320 301H388" stroke="#43bfff" stroke-width="4" marker-end="url(#arrow2)"/>

  <g filter="url(#shadow2)">
    <rect x="402" y="208" width="238" height="186" rx="22" fill="#112a43" stroke="#3b6e94" stroke-width="2"/>
    <text x="426" y="254" class="small2">ШАГ 1</text>
    <text x="426" y="300" class="label2">Ed25519 verify</text>
    <text x="426" y="335" class="body2">Встроенный public key</text>
    <text x="426" y="364" class="body2">Key ID + подпись payload</text>
  </g>

  <path d="M640 301H708" stroke="#43bfff" stroke-width="4" marker-end="url(#arrow2)"/>

  <g filter="url(#shadow2)">
    <rect x="722" y="208" width="238" height="186" rx="22" fill="#112a43" stroke="#3b6e94" stroke-width="2"/>
    <text x="746" y="254" class="small2">ШАГ 2</text>
    <text x="746" y="300" class="label2">Strict schema</text>
    <text x="746" y="335" class="body2">Неизвестные поля запрещены</text>
    <text x="746" y="364" class="body2">Домены и процессы проверены</text>
  </g>

  <path d="M960 301H1028" stroke="#43bfff" stroke-width="4" marker-end="url(#arrow2)"/>

  <g filter="url(#shadow2)">
    <rect x="1042" y="208" width="238" height="186" rx="22" fill="#112a43" stroke="#3b6e94" stroke-width="2"/>
    <text x="1066" y="254" class="small2">ШАГ 3</text>
    <text x="1066" y="300" class="label2">Revision + SHA-256</text>
    <text x="1066" y="335" class="body2">Без rollback</text>
    <text x="1066" y="364" class="body2">Без reuse той же ревизии</text>
  </g>

  <path d="M1280 301H1348" stroke="#43bfff" stroke-width="4" marker-end="url(#arrow2)"/>

  <g filter="url(#shadow2)">
    <rect x="1362" y="208" width="170" height="186" rx="22" fill="#123d3a" stroke="#35d3aa" stroke-width="2"/>
    <rect x="1384" y="232" width="86" height="26" rx="13" fill="url(#green2)"/>
    <text x="1427" y="250" text-anchor="middle" style="font:700 13px 'Segoe UI';fill:#06121f">APPLY</text>
    <text x="1384" y="300" class="label2">Atomic cache</text>
    <text x="1384" y="335" class="body2">temp + fsync</text>
    <text x="1384" y="364" class="body2">rename → каталог</text>
  </g>

  <rect x="82" y="474" width="1450" height="150" rx="22" fill="#161f31" stroke="#5b4653" stroke-width="2"/>
  <text x="112" y="516" class="small2">ОТКЛОНЯЕТСЯ ДО ПРИМЕНЕНИЯ</text>
  <g>
    <circle cx="126" cy="560" r="7" fill="#ff806d"/>
    <text x="148" y="567" class="bad2">Неверная подпись</text>
    <circle cx="390" cy="560" r="7" fill="#ff806d"/>
    <text x="412" y="567" class="bad2">Откат ревизии</text>
    <circle cx="635" cy="560" r="7" fill="#ff806d"/>
    <text x="657" y="567" class="bad2">Та же ревизия, другой digest</text>
    <circle cx="1016" cy="560" r="7" fill="#ff806d"/>
    <text x="1038" y="567" class="bad2">Критический процесс</text>
  </g>
  <text x="112" y="602" class="body2">Например: lsass.exe, services.exe, svchost.exe, winlogon.exe</text>
</svg>
